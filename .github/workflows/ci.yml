name: CI

# Pipeline simples de build + testes automatizados.
# Este projeto é um demonstrativo de portfólio e não é implantado em lugar
# nenhum, então este workflow não inclui deploy — só mostra a mecânica
# básica de um gate de build+test automatizado a cada push/PR. Num cenário
# real, esse mesmo pipeline poderia evoluir para incluir deploy, testes de
# integração com banco de dados real, etc.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test FamilyVaultApi.UnitTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory coverage

      - name: Integration tests
        run: dotnet test FamilyVaultApi.IntegrationTests --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory coverage

      # Junta a cobertura dos dois projetos e mostra o resumo na página do job.
      # A porcentagem do README é atualizada à mão a partir deste resumo.
      - name: Coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.4
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:"MarkdownSummaryGithub;TextSummary"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage/report/Summary.txt
